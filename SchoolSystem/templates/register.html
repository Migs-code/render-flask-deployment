<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head> <body class="login-page">
<div class="login-wrapper">

    <div class="login-box">

        <div class="logo">
            🎓
        </div>

        <h1>Create Account</h1>

        <p class="login-subtitle">
            Join the School System
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>

            <div class="input-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>

            <div class="input-group">

                <label for="role">
                    Account Type
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option value="">
                        Select account type
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="teacher">
                        Teacher
                    </option>

                </select>

            </div>

            <button
                class="login-button"
                type="submit"
            >
                Create Account
            </button>

        </form>

        <div class="account-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</div>

</body> </html>
